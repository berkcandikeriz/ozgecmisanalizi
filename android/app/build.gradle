plugins {
    id "com.android.application"
}

def serverUrl = (project.findProperty("serverUrl") ?: "").toString().trim()
def ciVersionCode = (project.findProperty("versionCode") ?: "1").toString().toInteger()
def ciVersionName = (project.findProperty("versionName") ?: "1.0.0").toString()

android {
    namespace "com.ozgecmisanalizi.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.ozgecmisanalizi.app"
        minSdk 24          // Android 7.0 ve üzeri
        targetSdk 35
        versionCode ciVersionCode
        versionName ciVersionName
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${serverUrl}\""
    }

    signingConfigs {
        // Depodaki anahtar herkese açıktır; yalnızca kişisel kurulum ve güncellemelerin aynı imzayla
        // yapılabilmesi içindir. Mağaza dağıtımı için ANDROID_KEYSTORE_* ortam değişkenleriyle kendi anahtarınızı verin.
        app {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            } else {
                storeFile file("ozgecmis-dev.keystore")
                storePassword "ozgecmis"
                keyAlias "ozgecmis"
                keyPassword "ozgecmis"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.app
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig signingConfigs.app
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "OzgecmisAnalizi-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}
